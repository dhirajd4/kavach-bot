[project]
name = "kavach-bot"
version = "0.1.0"
description = "Kavach P0: WhatsApp 'Bhej ke check karo' scam-check bot"
requires-python = ">=3.12"
# Exact pins only (supply-chain hygiene). Bump deliberately, to releases at least 14 days old,
# then `make lock` (hash-locked, the whole tree respects the same cutoff).
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "redis[hiredis]==8.1.0",
    "SQLAlchemy[asyncio]==2.1.1",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "tldextract==5.3.2",
    "pillow==12.3.0",
    "zxing-cpp==3.1.1",
]

[project.optional-dependencies]
# Installed only in the sandbox image (APK parsing happens there, never in api/worker).
apk = [
    "androguard==4.1.4",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "fakeredis==2.39.0",
    "respx==0.23.1",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "segno==1.6.6",
    "cryptography==50.0.2",
    "uv==0.12.21",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kavach = ["data/*.txt", "api/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs Postgres/Redis from docker compose"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106"]
# User-facing copy and corpus sentences read better unwrapped.
"src/kavach/verdict/templates.py" = ["E501"]
"tests/fixtures/*" = ["E501"]
# Dev scripts run a fixed local Chrome binary on files we generate; no untrusted input.
"scripts/*" = ["S603"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["kavach"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tldextract.*", "zxingcpp.*", "androguard.*", "loguru.*"]
ignore_missing_imports = true

# Playwright is installed only in the sandbox image, not the api/worker image or local venv.
[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true
